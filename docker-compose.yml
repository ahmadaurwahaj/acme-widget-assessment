services:
  composer:
    image: composer:2
    working_dir: /app
    volumes:
      - ./backend:/app
    command: install --no-interaction --no-progress

  api:
    image: php:8.5-cli-alpine
    working_dir: /app
    volumes:
      - ./backend:/app
    command: php -S 0.0.0.0:8000 -t public
    environment:
      RATE_LIMIT_PER_MINUTE: 300
    ports:
      - "8000:8000"
    depends_on:
      composer:
        condition: service_completed_successfully

  web:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      API_URL: http://api:8000
    ports:
      - "5173:5173"
    depends_on:
      - api
